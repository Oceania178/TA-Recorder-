<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>TA Call Recorder bar</title>
    <link rel="stylesheet" href="bar.css" />
  </head>
  <body data-state="idle">
    <div class="bar" id="bar">
      <span class="dot" aria-hidden="true"></span>
      <span class="timer" id="timer">00:00:00</span>
      <div class="meters" aria-label="Levels: you, other side">
        <div class="meter"><div class="fill left" id="meter-left"></div></div>
        <div class="meter"><div class="fill right" id="meter-right"></div></div>
      </div>
      <span class="warn" id="warn" title="Check the recorder window" hidden>!</span>
      <button id="btn-pause" type="button">Pause</button>
      <button id="btn-stop" class="stop" type="button">Stop</button>
      <button id="btn-open" class="open" type="button" title="Open the recorder">⤢</button>
    </div>
    <script src="bar.js"></script>
  </body>
</html>
